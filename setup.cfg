[metadata]
name = flask-on-docker
description = FlaskAPI in Docker
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/corinat/flask-on-docker
author = "Corina Tudorache"
author_email = "corina_ww@yahoo.com"
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
zip_safe = False

[options]
packages = find:
install_requires =
    Flask==3.0.3
    Flask-SQLAlchemy==3.1.1
    gunicorn==22.0.0
    psycopg2-binary==2.9.9
    requests==2.31.0
    Babel==2.14.0
    click==8.1.7
    Flask-Babel==4.0.0
    Flask-Cors==4.0.1
    Flask-Login==0.6.3
    itsdangerous==2.2.0
    Jinja2==3.1.3
    MarkupSafe==2.1.5
    mypy-extensions==1.1.0
    SQLAlchemy==2.0.30
    toml==0.10.2
    typing-extensions==4.11.0
    Werkzeug==3.0.2
    WTForms==3.1.2
    Flask-Migrate==4.0.5
    python-dotenv==1.0.1
    pandas==2.2.2
    haversine==2.9.0
python_requires = >=3.11
include_package_data = True
use_scm_version = True

[aliases]
release = sdist bdist_wheel

[bdist_wheel]
universal = 1

[flake8]
max-line-length = 120
max-complexity = 10
