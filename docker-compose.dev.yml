services:
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile.dev
    command: gunicorn -b 0.0.0.0:5000 manage:app
    volumes:
      - ./services/web:/home/app/web
    env_file:
      - .env.dev
      - .env.dev.db
    depends_on:
      - db
    restart: always

 
  nginx:
    image: nginx:1.25
    ports:
      - "8080:8080"
    volumes:
      - ./services/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    restart: always

  db:
    image: postgres:13
    restart: always
    env_file:
      - .env.dev.db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    ports:
      - "5555:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    restart: unless-stopped


volumes:
  pgdata:


